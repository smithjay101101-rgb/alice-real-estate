name: Ping IndexNow

# After each push to main, tells IndexNow (Bing, which feeds Copilot, and the
# other engines in the network) which pages changed. The script waits until
# Cloudflare Pages has deployed before sending. Pushes made by the listings
# workflow don't start this one, so that workflow pings for itself.
on:
  push:
    branches: ["main"]
    paths:
      - "**.html"
  workflow_dispatch:
    inputs:
      all:
        description: "Send every page in the sitemaps"
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send changed pages to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ github.event.inputs.all }}
        run: |
          if [ "$ALL" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            python3 tools/indexnow.py --all
          else
            python3 tools/indexnow.py --since "$BEFORE"
          fi
